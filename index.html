<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoLive — En Directo</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #12141c;
      --card-inner: #1a1d28;
      --accent: #ff4757;
      --green: #2ed573;
      --text: #ffffff;
      --text-muted: #8e95a5;
      --border: #232736;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 15px; min-height: 100vh; }
    
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { font-size: 28px; background: var(--card-inner); padding: 6px 12px; border-radius: 14px; border: 1px solid var(--border); }
    h1 { font-size: 24px; font-weight: 800; }
    h1 span { color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; width: 100%; max-width: 440px; margin-bottom: 15px; position: relative; }
    
    input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 12px; font-size: 14px; }
    
    button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-red { background: var(--accent); color: white; }
    .btn-green { background: var(--green); color: #000; }
    .btn-dark { background: var(--card-inner); color: white; border: 1px solid var(--border); margin-top: 10px; }

    .stream-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-inner); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; }
    .stream-name { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }

    .video-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 16px; overflow: hidden; margin-top: 10px; border: 2px solid var(--border); }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .hidden { display: none !important; }

    .controls-bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 30px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
    .controls-bar button { width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--card-inner); border-radius: 50%; border: 1px solid var(--border); }
    .controls-bar button.off { background: var(--accent); color: white; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🥔</div>
    <h1>Potato<span>Live</span></h1>
  </header>

  <!-- Panel Principal -->
  <div id="screen-setup" class="card">
    <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Tu nombre de usuario:</label>
    <input type="text" id="username" placeholder="Ej: Carlos" value="PotatoStreamer">

    <button id="btn-broadcast" class="btn-red">📹 Transmitir mi Cámara</button>

    <div style="margin-top: 25px;">
      <h3 style="font-size: 15px; margin-bottom: 8px;">🔴 Directos Activos:</h3>
      <div id="stream-list">
        <p style="font-size: 13px; color: var(--text-muted);">Buscando transmisiones...</p>
      </div>
    </div>
  </div>

  <!-- Pantalla de Transmisión (Streamer) -->
  <div id="screen-streamer" class="card hidden">
    <h3>🔴 Estás transmitiendo</h3>
    <div class="video-wrapper">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="controls-bar">
        <button id="ctrl-mic">🎤</button>
        <button id="ctrl-cam">📹</button>
        <button id="ctrl-flip">🔄</button>
      </div>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Finalizar Directo</button>
  </div>

  <!-- Pantalla de Espectador -->
  <div id="screen-viewer" class="card hidden">
    <h3 id="viewer-title">👀 Viendo directo</h3>
    <div class="video-wrapper">
      <video id="remote-video" autoplay playsinline controls></video>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Salir del Directo</button>
  </div>

  <script>
    const socket = io();
    let localStream;
    let peerConnections = {};
    let currentFacingMode = 'user';

    // Lista ampliada de servidores STUN públicos de Google y Mozilla
    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'stun:stun.services.mozilla.com' }
      ]
    };

    socket.on('update-stream-list', (streams) => {
      const list = document.getElementById('stream-list');
      list.innerHTML = '';

      if (streams.length === 0) {
        list.innerHTML = '<p style="font-size: 13px; color: var(--text-muted);">No hay nadie transmitiendo ahora mismo.</p>';
        return;
      }

      streams.forEach(s => {
        if (s.id === socket.id) return;
        const div = document.createElement('div');
        div.className = 'stream-item';
        div.innerHTML = `
          <div class="stream-name"><div class="live-dot"></div> ${s.username}</div>
          <button class="btn-green" style="width: auto; padding: 6px 12px;" onclick="watchStream('${s.id}', '${s.username}')">VER</button>
        `;
        list.appendChild(div);
      });
    });

    async function startMedia(facingMode) {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facingMode }, 
          audio: true 
        });
        
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;

        Object.values(peerConnections).forEach(pc => {
          const videoTrack = localStream.getVideoTracks()[0];
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(videoTrack);
        });

      } catch (e) {
        alert('Error al acceder a la cámara: ' + e.message);
      }
    }

    document.getElementById('btn-broadcast').onclick = async () => {
      const name = document.getElementById('username').value || 'Anónimo';
      await startMedia(currentFacingMode);

      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-streamer').classList.remove('hidden');

      socket.emit('start-stream', { username: name });
    };

    document.getElementById('ctrl-mic').onclick = () => {
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById('ctrl-mic').classList.toggle('off', !track.enabled);
      }
    };

    document.getElementById('ctrl-cam').onclick = () => {
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById('ctrl-cam').classList.toggle('off', !track.enabled);
      }
    };

    document.getElementById('ctrl-flip').onclick = async () => {
      currentFacingMode = (currentFacingMode === 'user' ? 'environment' : 'user');
      await startMedia(currentFacingMode);
    };

    async function watchStream(targetId, username) {
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-viewer').classList.remove('hidden');
      document.getElementById('viewer-title').innerText = `👀 Viendo a ${username}`;

      const pc = createPeerConnection(targetId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('signal', { to: targetId, signal: pc.localDescription });
    }

    socket.on('signal', async (data) => {
      let pc = peerConnections[data.from] || createPeerConnection(data.from);

      if (data.signal.type === 'offer') {
        if (localStream) {
          localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }
        await pc.setRemoteDescription(new RTCSessionDescription(data.signal));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('signal', { to: data.from, signal: pc.localDescription });

      } else if (data.signal.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(data.signal));

      } else if (data.signal.candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(data.signal));
        } catch (e) {
          console.error("Error ICE", e);
        }
      }
    });

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(config);
      peerConnections[targetId] = pc;

      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('signal', { to: targetId, signal: { candidate: e.candidate } });
      };

      pc.ontrack = e => {
        const remoteVideo = document.getElementById('remote-video');
        if (remoteVideo.srcObject !== e.streams[0]) {
          remoteVideo.srcObject = e.streams[0];
          
          // Fuerza la reproducción y desactiva silenciar si hace falta
          remoteVideo.play().catch(() => {
            console.log("Play diferido por interactividad");
          });
        }
      };

      return pc;
    }
  </script>
</body>
</html>
