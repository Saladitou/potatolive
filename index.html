<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoLive — En Directo (V2)</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #12141c;
      --card-inner: #1a1d28;
      --accent: #ff4757;
      --green: #2ed573;
      --text: #ffffff;
      --text-muted: #8e95a5;
      --border: #232736;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 15px; min-height: 100vh; padding-bottom: 80px; }
    
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { font-size: 28px; background: var(--card-inner); padding: 6px 12px; border-radius: 14px; border: 1px solid var(--border); }
    h1 { font-size: 24px; font-weight: 800; }
    h1 span { color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; width: 100%; max-width: 440px; margin-bottom: 15px; position: relative; }
    
    input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 12px; font-size: 14px; }
    
    button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-red { background: var(--accent); color: white; }
    .btn-green { background: var(--green); color: #000; }
    .btn-dark { background: var(--card-inner); color: white; border: 1px solid var(--border); margin-top: 10px; }

    .stream-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-inner); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; }
    .stream-name { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }

    .video-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 16px; overflow: hidden; margin-top: 10px; border: 2px solid var(--border); }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .hidden { display: none !important; }

    /* Barra de Controles flotante */
    .controls-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 12px; backdrop-filter: blur(4px); }
    .controls-bar button { width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--card-inner); border-radius: 8px; }
    .controls-bar button.active { background: var(--accent); }
    .controls-bar button.mute.muted { background: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="logo">🥔</div>
    <h1>Potato<span>Live</span></h1>
  </header>

  <!-- Panel Principal: Login y Lista -->
  <div id="screen-setup" class="card">
    <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Tu nombre de usuario:</label>
    <input type="text" id="username" placeholder="Ej: Carlos" value="PotatoStreamer">

    <button id="btn-broadcast" class="btn-red">📹 Transmitir mi Cámara</button>

    <div style="margin-top: 25px;">
      <h3 style="font-size: 15px; margin-bottom: 8px;">🔴 Directos Activos:</h3>
      <div id="stream-list">
        <p style="font-size: 13px; color: var(--text-muted);">Buscando transmisiones...</p>
      </div>
    </div>
  </div>

  <!-- Pantalla de Transmisión (Streamer) con CONTROLES -->
  <div id="screen-streamer" class="card hidden">
    <h3>🔴 Estás transmitiendo</h3>
    <div class="video-wrapper">
      <!-- SOLUCIÓN 1: Añadidos muted, playsinline, y forzamos el autoplay -->
      <video id="local-video" autoplay playsinline muted></video>
      
      <!-- SOLUCIÓN 2: Barra de controles para el Streamer -->
      <div class="controls-bar">
        <button id="ctrl-mic" class="mute">🎤</button>
        <button id="ctrl-cam">📹</button>
        <button id="ctrl-flip">🔄</button>
      </div>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Finalizar Directo</button>
  </div>

  <!-- Pantalla de Espectador -->
  <div id="screen-viewer" class="card hidden">
    <h3 id="viewer-title">👀 Viendo directo</h3>
    <div class="video-wrapper">
      <video id="remote-video" autoplay playsinline></video>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Salir del Directo</button>
  </div>

  <script>
    const socket = io();
    let localStream, peerConnection;
    let currentFacingMode = 'user'; // Cámara delantera por defecto
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Actualizar lista de directos automática
    socket.on('update-stream-list', (streams) => {
      const list = document.getElementById('stream-list');
      list.innerHTML = '';

      if (streams.length === 0) {
        list.innerHTML = '<p style="font-size: 13px; color: var(--text-muted);">No hay nadie transmitiendo ahora mismo.</p>';
        return;
      }

      streams.forEach(s => {
        if (s.id === socket.id) return;
        const div = document.createElement('div');
        div.className = 'stream-item';
        div.innerHTML = `
          <div class="stream-name"><div class="live-dot"></div> ${s.username}</div>
          <button class="btn-green" style="width: auto; padding: 6px 12px;" onclick="watchStream('${s.id}', '${s.username}')">VER</button>
        `;
        list.appendChild(div);
      });
    });

    // --- SOLUCIÓN 1 & 2: Gestión de cámara y controles del streamer ---

    async function startMedia(facingMode) {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode }, 
          audio: true 
        });
        
        // Asignamos el stream al vídeo local y forzamos autoplay
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        localVideo.onloadedmetadata = () => localVideo.play();
        
        // Si ya hay una conexión WebRTC activa, actualizamos las pistas de vídeo
        if (peerConnection) {
          const videoTrack = localStream.getVideoTracks()[0];
          const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
          if (sender) sender.replaceTrack(videoTrack);
        }
        
      } catch (e) {
        alert('Error al acceder a la cámara/micrófono: ' + e.message);
      }
    }

    // Iniciar Transmisión (Botón Rojo)
    document.getElementById('btn-broadcast').onclick = async () => {
      const name = document.getElementById('username').value || 'Anónimo';
      
      // Iniciamos media por defecto (cámara delantera)
      await startMedia(currentFacingMode);

      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-streamer').classList.remove('hidden');

      socket.emit('start-stream', { username: name });
    }

    // Programación de los BOTONES DE CONTROL del Streamer
    document.getElementById('ctrl-mic').onclick = () => {
      const audioTrack = localStream.getAudioTracks()[0];
      audioTrack.enabled = !audioTrack.enabled;
      document.getElementById('ctrl-mic').classList.toggle('muted', !audioTrack.enabled);
    };

    document.getElementById('ctrl-cam').onclick = () => {
      const videoTrack = localStream.getVideoTracks()[0];
      videoTrack.enabled = !videoTrack.enabled;
      document.getElementById('ctrl-cam').classList.toggle('muted', !videoTrack.enabled);
    };

    document.getElementById('ctrl-flip').onclick = async () => {
      // Cambiamos entre delantera ('user') y trasera ('environment')
      currentFacingMode = (currentFacingMode === 'user' ? 'environment' : 'user');
      await startMedia(currentFacingMode);
    };


    // --- Ver un directo (Espectador) ---
    async function watchStream(targetId, username) {
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-viewer').classList.remove('hidden');
      document.getElementById('viewer-title').innerText = `👀 Viendo a ${username}`;

      peerConnection = createPeerConnection(targetId);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { to: targetId, signal: peerConnection.localDescription });
    }

    // Manejo automático de señales WebRTC de fondo
    socket.on('signal', async (data) => {
      if (!peerConnection) {
        peerConnection = createPeerConnection(data.from);
      }

      if (data.signal.type === 'offer') {
        peerConnection.addStream(localStream);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { to: data.from, signal: peerConnection.localDescription });
      } else if (data.signal.type === 'answer') {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
      } else if (data.signal.candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal));
      }
    });

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(config);
      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('signal', { to: targetId, signal: { candidate: e.candidate } });
      };
      pc.ontrack = e => {
        document.getElementById('remote-video').srcObject = e.streams[0];
      };
      return pc;
    }
  </script>
</body>
</html>
