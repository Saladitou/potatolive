<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoLive — V3</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b0c10; --card: #12141c; --card-inner: #1a1d28;
      --accent: #ff4757; --green: #2ed573; --text: #ffffff;
      --text-muted: #8e95a5; --border: #232736;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; }
    
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { font-size: 28px; background: var(--card-inner); padding: 6px 12px; border-radius: 14px; border: 1px solid var(--border); }
    h1 { font-size: 24px; font-weight: 800; } h1 span { color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; width: 100%; max-width: 480px; margin-bottom: 15px; position: relative; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 14px; }
    
    button { padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-red { background: var(--accent); color: white; width: 100%; }
    .btn-green { background: var(--green); color: #000; }
    .btn-dark { background: var(--card-inner); color: white; border: 1px solid var(--border); width: 100%; margin-top: 10px; }
    .btn-icon { background: var(--card-inner); color: white; border: 1px solid var(--border); }

    /* Barra de filtros */
    .filters { display: flex; gap: 8px; margin-bottom: 15px; }

    /* Lista de directos */
    .stream-item { background: var(--card-inner); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .stream-header { display: flex; justify-content: space-between; align-items: center; }
    .stream-info { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; }
    .badge { background: #232736; padding: 3px 8px; border-radius: 6px; color: white; }

    /* Contenedor de Vídeo */
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; background: #050505; border-radius: 16px; overflow: hidden; margin-top: 10px; border: 2px solid var(--border); display: flex; justify-content: center; align-items: center; }
    .video-wrapper.horizontal { aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    
    .hidden { display: none !important; }

    /* Controles */
    .controls-bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 30px; backdrop-filter: blur(8px); z-index: 20; }
    .controls-bar button { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--card-inner); border-radius: 50%; padding: 0; }
    .controls-bar button.off { background: var(--accent); color: white; }

    /* Overlays de vídeo */
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .live-stats { font-size: 13px; color: var(--text-muted); font-weight: bold; }
    .cam-off-msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 15; text-align: center; padding: 20px; }
    .loader { width: 30px; height: 30px; border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; position: absolute; z-index: 10;}
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">🥔</div>
    <h1>Potato<span>Live</span></h1>
  </header>

  <!-- PANEL PRINCIPAL (SETUP) -->
  <div id="screen-setup" class="card">
    <div class="input-group">
      <input type="text" id="username" placeholder="Tu nombre..." value="Pato">
      <button class="btn-icon" id="btn-random-name" title="Nombre aleatorio">🎲</button>
    </div>
    
    <div class="input-group">
      <select id="category">
        <option value="Charlando">Charlando</option>
        <option value="Gaming">Gaming</option>
        <option value="IRL">IRL</option>
        <option value="Música">Música</option>
        <option value="Deportes">Deportes</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Educación">Educación</option>
        <option value="Cocina">Cocina</option>
        <option value="Arte">Arte</option>
        <option value="Eventos">Eventos</option>
        <option value="Fitness">Fitness</option>
        <option value="Noticias">Noticias</option>
        <option value="ASMR">ASMR</option>
        <option value="Vlogs">Vlogs</option>
        <option value="Otros">Otros</option>
      </select>
      <select id="format">
        <option value="vertical">📱 Vertical</option>
        <option value="horizontal">💻 Horizontal</option>
      </select>
    </div>
    <select id="quality" style="margin-bottom: 15px;">
      <option value="720">Calidad: 720p (Recomendado)</option>
      <option value="1080">Calidad: 1080p (Alta)</option>
      <option value="480">Calidad: 480p (Fluido)</option>
    </select>

    <button id="btn-broadcast" class="btn-red">📹 Iniciar Directo</button>

    <div style="margin-top: 30px;">
      <h3 style="font-size: 15px; margin-bottom: 10px;">🔴 Explorar Canales</h3>
      <div class="filters">
        <input type="text" id="search-bar" placeholder="Buscar canal..." onkeyup="renderStreamList()">
        <select id="sort-select" onchange="renderStreamList()" style="width: 140px;">
          <option value="viewers">🔥 Top Viewers</option>
          <option value="recent">🕒 Más recientes</option>
          <option value="alpha">A-Z Alfabético</option>
        </select>
      </div>
      <div id="stream-list">
        <p style="font-size: 13px; color: var(--text-muted);">Buscando transmisiones...</p>
      </div>
    </div>
  </div>

  <!-- PANTALLA STREAMER -->
  <div id="screen-streamer" class="card hidden">
    <div class="status-bar">
      <h3>🔴 En Directo</h3>
      <div class="live-stats" id="streamer-stats">⏱️ 00:00 | 👁️ 0</div>
    </div>
    <div class="video-wrapper" id="streamer-wrapper">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="controls-bar">
        <button id="ctrl-mic">🎤</button>
        <button id="ctrl-cam">📹</button>
        <button id="ctrl-screen">💻</button>
        <button id="ctrl-flip">🔄</button>
      </div>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Finalizar Directo</button>
  </div>

  <!-- PANTALLA ESPECTADOR -->
  <div id="screen-viewer" class="card hidden">
    <div class="status-bar">
      <h3 id="viewer-title">👀 Viendo directo</h3>
      <div class="live-stats" id="viewer-stats">⏱️ 00:00 | 👁️ 0</div>
    </div>
    <div class="video-wrapper" id="viewer-wrapper">
      <div class="loader" id="viewer-loader"></div>
      <div class="cam-off-msg hidden" id="cam-off-overlay">🚫 El streamer ha pausado la cámara</div>
      <video id="remote-video" autoplay playsinline></video>
      <div class="controls-bar">
        <button id="ctrl-fullscreen">🔲</button>
      </div>
    </div>
    <button onclick="location.reload()" class="btn-dark">✕ Salir del Directo</button>
  </div>

  <script>
    const socket = io();
    let localStream, screenStream;
    let peerConnections = {};
    let currentFacingMode = 'user';
    let currentStreamsData = [];
    let streamStartTime = null;
    let updateTimerInterval;
    let targetStreamerId = null;

    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 1. GENERADOR DE NOMBRES Y GESTIÓN DE SALA
    const adj = ["Feliz", "Ninja", "Pro", "Loco", "Master", "Live", "Gamer"];
    const noun = ["Pato", "Potato", "Gato", "Lobo", "Oso", "Panda"];
    document.getElementById('btn-random-name').onclick = () => {
      document.getElementById('username').value = noun[Math.floor(Math.random()*noun.length)] + adj[Math.floor(Math.random()*adj.length)] + Math.floor(Math.random()*99);
    };

    socket.on('update-stream-list', (streams) => {
      currentStreamsData = streams;
      renderStreamList();
      
      // Actualizar stats para el espectador
      if (targetStreamerId) {
        const s = streams.find(x => x.id === targetStreamerId);
        if (s) updateTimeAndStats('viewer-stats', s.startTime, s.viewers);
      }
    });

    function renderStreamList() {
      const list = document.getElementById('stream-list');
      const search = document.getElementById('search-bar').value.toLowerCase();
      const sort = document.getElementById('sort-select').value;
      list.innerHTML = '';

      let filtered = currentStreamsData.filter(s => s.id !== socket.id && s.username.toLowerCase().includes(search));
      
      if (sort === 'viewers') filtered.sort((a,b) => b.viewers - a.viewers);
      else if (sort === 'recent') filtered.sort((a,b) => b.startTime - a.startTime);
      else if (sort === 'alpha') filtered.sort((a,b) => a.username.localeCompare(b.username));

      if (filtered.length === 0) {
        list.innerHTML = '<p style="font-size: 13px; color: var(--text-muted);">No se encontraron canales.</p>';
        return;
      }

      filtered.forEach(s => {
        const uptime = Math.floor((Date.now() - s.startTime) / 60000);
        const div = document.createElement('div');
        div.className = 'stream-item';
        div.innerHTML = `
          <div class="stream-header">
            <strong>🔴 ${s.username}</strong>
            <button class="btn-green" style="padding: 6px 12px;" onclick="watchStream('${s.id}', '${s.username}')">VER</button>
          </div>
          <div class="stream-info">
            <span class="badge">👁️ ${s.viewers}</span>
            <span class="badge">🏷️ ${s.category}</span>
            <span>⏱️ ${uptime}m</span>
          </div>
        `;
        list.appendChild(div);
      });
    }

    // 2. UTILIDADES DE TIEMPO
    function updateTimeAndStats(elementId, startTime, viewers) {
      const mins = Math.floor((Date.now() - startTime) / 60000);
      document.getElementById(elementId).innerText = `⏱️ ${mins}m | 👁️ ${viewers}`;
    }

    // 3. INICIO DE STREAM (STREAMER)
    document.getElementById('btn-broadcast').onclick = async () => {
      let name = document.getElementById('username').value || 'Anónimo';
      
      // Prevenir duplicados
      if (currentStreamsData.find(s => s.username.toLowerCase() === name.toLowerCase())) {
        name = name + Math.floor(Math.random() * 1000);
        alert(`Ese nombre ya existe. Te hemos asignado: ${name}`);
        document.getElementById('username').value = name;
      }

      const quality = document.getElementById('quality').value;
      const format = document.getElementById('format').value;
      
      if (format === 'horizontal') document.getElementById('streamer-wrapper').classList.add('horizontal');

      await startMedia(currentFacingMode, quality);
      
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-streamer').classList.remove('hidden');
      
      streamStartTime = Date.now();
      updateTimerInterval = setInterval(() => {
        // Enviar cantidad de peers activos al servidor
        const viewers = Object.keys(peerConnections).length;
        socket.emit('update-viewers', viewers);
        updateTimeAndStats('streamer-stats', streamStartTime, viewers);
      }, 5000); // Actualiza stats cada 5 segundos

      socket.emit('start-stream', { username: name, category: document.getElementById('category').value, format: format });
    };

    async function startMedia(facingMode, res) {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      try {
        // Optimizaciones WebRTC para evitar lag (24 fps y resolución controlada)
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode, height: { ideal: parseInt(res) }, frameRate: { ideal: 24, max: 30 } }, 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        document.getElementById('local-video').srcObject = localStream;
        updatePeersTracks();
      } catch (e) { alert('Error cámara: ' + e.message); }
    }

    function updatePeersTracks() {
      Object.values(peerConnections).forEach(pc => {
        const vTrack = localStream.getVideoTracks()[0];
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && vTrack) sender.replaceTrack(vTrack);
      });
    }

    // CONTROLES DEL STREAMER
    document.getElementById('ctrl-mic').onclick = () => {
      const track = localStream.getAudioTracks()[0];
      if (track) { track.enabled = !track.enabled; document.getElementById('ctrl-mic').classList.toggle('off', !track.enabled); }
    };
    
    document.getElementById('ctrl-cam').onclick = () => {
      const track = localStream.getVideoTracks()[0];
      if (track) { 
        track.enabled = !track.enabled; 
        document.getElementById('ctrl-cam').classList.toggle('off', !track.enabled); 
        socket.emit('camera-status', { enabled: track.enabled });
      }
    };

    document.getElementById('ctrl-flip').onclick = () => {
      currentFacingMode = (currentFacingMode === 'user' ? 'environment' : 'user');
      startMedia(currentFacingMode, document.getElementById('quality').value);
    };

    document.getElementById('ctrl-screen').onclick = async () => {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const screenTrack = screenStream.getVideoTracks()[0];
        document.getElementById('local-video').srcObject = screenStream;
        
        Object.values(peerConnections).forEach(pc => {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(screenTrack);
        });

        screenTrack.onended = () => {
          document.getElementById('local-video').srcObject = localStream;
          updatePeersTracks();
        };
      } catch(e) {}
    };

    // 4. ESPECTADOR
    function watchStream(targetId, username) {
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-viewer').classList.remove('hidden');
      document.getElementById('viewer-title').innerText = `👀 Viendo a ${username}`;
      targetStreamerId = targetId;

      const streamData = currentStreamsData.find(s => s.id === targetId);
      if (streamData && streamData.format === 'horizontal') {
        document.getElementById('viewer-wrapper').classList.add('horizontal');
      }

      socket.emit('signal', { to: targetId, signal: { type: 'viewer-ready' } });
    }

    // Pantalla completa (Mantiene verticalidad nativa)
    document.getElementById('ctrl-fullscreen').onclick = () => {
      const wrapper = document.getElementById('viewer-wrapper');
      if (wrapper.requestFullscreen) wrapper.requestFullscreen();
      else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    };

    document.getElementById('remote-video').onplaying = () => {
      document.getElementById('viewer-loader').style.display = 'none';
    };

    // Recibir estado de cámara apagada
    socket.on('peer-camera-status', (data) => {
      if (data.streamerId === targetStreamerId) {
        if (data.enabled) document.getElementById('cam-off-overlay').classList.add('hidden');
        else document.getElementById('cam-off-overlay').classList.remove('hidden');
      }
    });

    // 5. NÚCLEO WEBRTC
    socket.on('signal', async (data) => {
      let pc = peerConnections[data.from];
      try {
        if (data.signal.type === 'viewer-ready') {
          pc = createPeerConnection(data.from);
          if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          socket.emit('signal', { to: data.from, signal: { type: 'offer', sdp: offer } });

        } else if (data.signal.type === 'offer') {
          pc = createPeerConnection(data.from);
          await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit('signal', { to: data.from, signal: { type: 'answer', sdp: answer } });

        } else if (data.signal.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));

        } else if (data.signal.candidate) {
          if (!pc) pc = createPeerConnection(data.from);
          await pc.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
        }
      } catch (err) { console.error("WebRTC Error:", err); }
    });

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(config);
      peerConnections[targetId] = pc;

      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('signal', { to: targetId, signal: { type: 'candidate', candidate: e.candidate } });
      };

      pc.ontrack = e => {
        document.getElementById('remote-video').srcObject = e.streams[0];
      };

      // Limpiar conexiones si alguien se va
      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          delete peerConnections[targetId];
        }
      };

      return pc;
    }
  </script>
</body>
</html>
